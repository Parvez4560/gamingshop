<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- ভাইব্রেন্ট পার্পল ও নিয়ন গ্রেডিয়েন্ট -->
    <linearGradient id="orbitalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff00cc" />
      <stop offset="50%" stop-color="#81007f" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <!-- স্মুথ নিয়ন গ্লো -->
    <filter id="orbitalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#ff00cc" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="none" />

  <!-- অরবিটাল রিং এবং সেন্ট্রাল ফিউশন কোর (গতি এবং মেলবন্ধনের প্রতীক) -->
  <g transform="translate(0, 0)" filter="url(#orbitalGlow)">
    <!-- প্রথম আউটার টিল্টেড অরবিট রিং -->
    <ellipse cx="256" cy="256" rx="180" ry="70" 
             fill="none" 
             stroke="url(#orbitalGradient)" 
             stroke-width="12" 
             transform="rotate(-30 256 256)" />

    <!-- দ্বিতীয় আউটার টিল্টেড অরবিট রিং (অন্য দিক থেকে এসে মিলিত হওয়া) -->
    <ellipse cx="256" cy="256" rx="180" ry="70" 
             fill="none" 
             stroke="url(#orbitalGradient)" 
             stroke-width="12" 
             transform="rotate(30 256 256)" 
             opacity="0.85" />

    <!-- একদম মাঝখানের ফিউচারিস্টিক এনার্জি কোর (মাস্টার মিলন বিন্দু) -->
    <circle cx="256" cy="256" r="45" fill="#0d0216" stroke="url(#orbitalGradient)" stroke-width="10" />
    <circle cx="256" cy="256" r="16" fill="#ffffff" />
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- গোল্ডেন গ্রেডিয়েন্ট (সুপারসেলের গোল্ড ও জেমসের ভাব আনতে) -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="50%" stop-color="#FFB800" />
      <stop offset="100%" stop-color="#D48800" />
    </linearGradient>
    
    <!-- ব্যাকগ্রাউন্ড ও শ্যাডো এফেক্ট -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- ব্যাকগ্রাউন্ড শিল্ড (নিরাপত্তা ও বিশ্বস্ততার প্রতীক) -->
  <path d="M256 32L64 96v144c0 114.9 83.2 222.4 192 248 108.8-25.6 192-133.1 192-248V96L256 32z" 
        fill="#111827" 
        stroke="url(#goldGradient)" 
        stroke-width="16" 
        filter="url(#shadow)" />

  <!-- ভেতরের গোল্ডেন ডায়মন্ড বা ক্রাউন (গেমের জেমসের প্রতীক) -->
  <path d="M256 128l64 96-64 160-64-160 64-96z" 
        fill="url(#goldGradient)" />
  
  <!-- ডায়মন্ডের মাঝখানের উজ্জ্বল রিফ্লেকশন লাইন -->
  <path d="M256 128l32 96-32 160-32-160 32-96z" 
        fill="#FFFFFF" 
        fill-opacity="0.3" />
</svg>